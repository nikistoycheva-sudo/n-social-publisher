<title>Табло · N NAILS · НА НОКТИ</title>
<style>
:root { --bg:#120f0d; --card:#1f1a17; --ink:#f4ece1; --muted:#9a8c7e; --line:#3a302a; --gold:#e3c17a;
  --grad: linear-gradient(120deg,#b98236 0%,#e9cf8a 45%,#c3913f 70%,#f3e19d 100%); }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
body { display: grid; place-items: center; min-height: 100vh; padding: 16px;
  background-image: radial-gradient(900px 420px at 15% -10%, rgba(227,193,122,.13), transparent 60%),
                    radial-gradient(700px 380px at 100% 110%, rgba(227,193,122,.08), transparent 55%); }
.card { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--line); border-radius: 22px;
  padding: 34px 28px 26px; text-align: center; box-shadow: 0 30px 60px -30px rgba(0,0,0,.8); position: relative; overflow: hidden; }
.card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--grad); }
.mark { width: 66px; height: 66px; margin: 0 auto 16px; border-radius: 50%; background: #fbf4e6; display: grid; place-items: center;
  color: #a87a35; font: 700 30px "Didot","Bodoni 72",Georgia,serif; box-shadow: 0 0 0 1.5px rgba(195,141,69,.6); }
.eyebrow { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; font-weight: 700;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
h1 { font: 600 30px/1.1 "Didot","Bodoni 72",Georgia,serif; margin: 8px 0 6px; }
h1 em { color: var(--gold); }
p { color: var(--muted); margin: 0 0 22px; font-size: 14px; }
input[type=password] { width: 100%; padding: 13px 16px; border-radius: 12px; border: 1px solid var(--line); background: #171310;
  color: var(--ink); font-size: 16px; outline: none; text-align: center; letter-spacing: .04em; }
input[type=password]:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(227,193,122,.15); }
button { width: 100%; margin-top: 12px; padding: 13px; border: 0; border-radius: 12px; background: var(--gold); color: #1f1a17;
  font-weight: 700; font-size: 15px; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
label { display: flex; gap: 8px; justify-content: center; align-items: center; color: var(--muted); font-size: 13px; margin-top: 14px; cursor: pointer; }
.err { color: #ff7b74; font-size: 13.5px; min-height: 20px; margin-top: 12px; }
.foot { color: var(--muted); font-size: 12px; margin-top: 18px; opacity: .8; }
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = "tablo-key-" + P.s.slice(0, 8);
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(P.s), iterations: P.n }, base, 256));
}
async function open(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const zipped = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.i) }, key, b64(P.d));
  const html = await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open(); document.write(html); document.close();
}
const saved = (() => { try { return localStorage.getItem(KEY); } catch (e) { return null; } })();
if (saved) open(b64(saved)).catch(() => { try { localStorage.removeItem(KEY); } catch (e) {} });
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Отключвам…"; err.textContent = "";
  try {
    const raw = await keyFrom(document.getElementById("pw").value.trim());
    await open(raw);
    if (document.getElementById("remember")?.checked) try { localStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch (e) {}
  } catch (x) {
    err.textContent = "Грешна парола. Опитай пак.";
    btn.disabled = false; btn.textContent = "Отвори таблото";
  }
});
</script>
